name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      # CI環境用のダミーDB接続文字列。Prisma generate や型チェックで使用される（Secrets不要）
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/enishio_test?schema=public"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # 移行済みUIに装飾（グラデーション・色付きの影・既定パレット直指定など）が
      # 混入していないかの回帰チェック。決め事は .claude/skills/ui-design/SKILL.md。
      - name: Check UI design tokens
        run: npm run check:ui

      - name: Run unit tests (Vitest)
        run: npm run test

      - name: Build Next.js application
        run: npm run build

      - name: Check for secret leaks in client bundle
        run: npm run check:no-leak

      # E2Eテストは全APIルートをモック（page.route）しているため、実DBや実LLM APIキーなしで実行可能
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: "true"

  integration:
    name: Integration (real PostgreSQL)
    runs-on: ubuntu-latest

    # 単体テストとE2EはDBを持たない（前者はモック、後者はルートモック）。
    # サーバのコードが実際にDBへ正しく書けているかを通しで見るのはこのジョブだけである。
    # LLM 呼び出しはこのジョブでもモックしてある。課金の発生する経路はCIに入れない。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enishio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enishio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/enishio_test?schema=public"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply schema to the test database
        run: npx prisma db push --skip-generate

      - name: Seed anchor items
        run: npm run seed:anchors

      - name: Run integration tests (Vitest, real DB)
        run: npm run test:integration
